name: Build and Upload PyWebGuard Package

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  docker_smoke:
    uses: ./.github/workflows/docker-smoke.yaml

  release:
    needs: [ci, docker_smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/release.yaml
    with:
      coverage: ${{ needs.ci.outputs.coverage }}
    secrets: inherit

  publish:
    needs: [release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish.yaml
    with:
      version: ${{ needs.release.outputs.tag }}
    secrets: inherit

  notify:
    needs: [ci, docker_smoke, release, publish]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/notify.yaml
    with:
      coverage: ${{ needs.ci.outputs.coverage }}
      ci_result: ${{ needs.ci.result }}
      docker_smoke_result: ${{ needs.docker_smoke.result }}
      release_result: ${{ needs.release.result }}
      publish_result: ${{ needs.publish.result }}
    secrets: inherit
